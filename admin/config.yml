backend:
  name: git-gateway
  branch: main # or master depending on your repo branch

media_folder: "assets/images" # Where uploaded property photos get saved
public_folder: "/assets/images"

collections:
  - name: "properties"
    label: "Properties"
    folder: "content/properties"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Property Title", name: "title", widget: "string" }
      - { label: "Purpose", name: "purpose", widget: "select", options: ["For Sale", "For Rent", "Land"] }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Property Image", name: "image", widget: "image" }
      - { label: "Description", name: "body", widget: "markdown" }
      
